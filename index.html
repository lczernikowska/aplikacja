<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEWNY EGZAMIN</title>
<meta name="theme-color" content="#5b2a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pewny Egzamin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#f8f6fb; --line:#e7e2ee; --fg:#1f1a2b; --muted:#6b6478;
  --accent:#5b2a86; --accent-soft:#f2ebf9; --on-accent:#ffffff;
  --mustard:#d9a21b; --mustard-soft:#fcf3da; --mustard-ink:#7a5800;
  --ok:#1b7646; --ok-soft:#e1f3e8; --warn:#b4530a; --warn-soft:#fdeedd; --bad:#bf2f29; --bad-soft:#fbe6e4;
  --shadow:0 18px 50px rgba(31,26,43,.18);
  --f:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font:15px/1.55 var(--f);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding-top:12px}
.topin.solo{padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--accent);white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--mustard)}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex-basis:100%;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;padding:10px 12px 9px;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs button:hover{color:var(--accent)}
nav.tabs button[aria-current]{color:var(--accent);font-weight:600;border-bottom-color:var(--mustard)}
main{padding-block:28px 72px;display:grid;gap:22px}
h1{font-weight:600;font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:18px;line-height:1.3;margin:0}
h3{font-size:15px;margin:0}
p{margin:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head>div{display:grid;gap:8px;min-width:0}
.head>div.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.mustard{background:var(--mustard);border-color:var(--mustard);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:16px;display:grid;gap:12px;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.mus{background:var(--mustard-soft);color:var(--mustard-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.pills button:hover{color:var(--accent);border-color:var(--accent)}
.pills button[aria-pressed="true"]{background:var(--mustard-soft);border-color:var(--mustard);color:var(--fg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:8px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap;background:var(--bg)}
.row .grow{flex:1;min-width:180px;display:grid;gap:2px}
button.row{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.row:hover{border-color:var(--accent)}
details.lesson{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.lesson[open]{border-color:var(--accent)}
details.lesson.next{border-color:var(--mustard);box-shadow:0 0 0 1px var(--mustard)}
details.lesson.done summary .ttl{color:var(--muted)}
details.lesson summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
details.lesson summary::-webkit-details-marker{display:none}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:28px}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:120px}
.ttl{flex:1;min-width:180px;font-weight:600}
.lbody{padding:0 14px 14px;display:grid;gap:12px}
.blocks{display:grid;gap:6px}
.blk{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border-radius:8px;padding:8px 10px}
.blk .min{font-weight:700;color:var(--mustard-ink);font-variant-numeric:tabular-nums}
.blk ul{margin:4px 0 0;padding-left:18px}
.hw{display:grid;gap:6px}
.hwi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-left:3px solid var(--mustard);padding:4px 10px}
.hwi span.t{flex:1;min-width:180px}
label.f{display:grid;gap:5px;font-weight:600;font-size:13px;min-width:0}
input,select,textarea{font:inherit;font-weight:400;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.check{display:inline-flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.notice{background:var(--mustard-soft);border-radius:var(--r);padding:12px 16px;display:grid;gap:6px}
.notice.bad{background:var(--bad-soft)}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:18px}
.logo{display:grid;gap:4px;text-align:center}
.logo b{font-size:26px;letter-spacing:.08em;color:var(--accent)}
.logo span{color:var(--mustard-ink);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.compact th{text-transform:none;letter-spacing:0;font-size:11.5px;padding:8px 4px}
table.compact td{padding:7px 4px}
table.compact .chip{padding:2px 6px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface)}
/* test */
.sheet{max-width:760px;display:grid;gap:4px}
.passage{background:var(--surface);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;margin-top:10px}
.passage h3{font-size:16px}
.passage p{line-height:1.7}
.passage .pl{font-weight:700;color:var(--accent)}
.q{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.qn{font-weight:700;font-size:14px;color:var(--muted)}
.qt{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;gap:6px}
.opts.inline{display:flex;flex-wrap:wrap;gap:6px 10px}.opts.inline .opt{width:auto;padding:4px}
.qimg{display:block;max-width:100%;height:auto;border-radius:6px;background:#fff}
.opt{font:inherit;color:inherit;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:6px 8px;border-radius:10px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){background:var(--surface)}
.opt:disabled{cursor:default}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"] .bub{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.bub.right{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bub.wrong{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.opt.isright{background:var(--ok-soft)}
.expl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:4px}
.expl b{color:var(--accent)}
.verdict{font-weight:700;font-size:13px} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.scorecard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);padding:16px 18px}
.score{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.submitbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(31,26,43,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 12px}
.modal{background:var(--bg);border-radius:14px;max-width:520px;width:100%;box-shadow:var(--shadow);margin:auto 0}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .x{font:inherit;font-size:22px;border:0;background:none;color:var(--muted);cursor:pointer;line-height:1}
.mb{padding:18px 20px;display:grid;gap:14px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
pre.copy{background:var(--surface);border-radius:8px;padding:12px;white-space:pre-wrap;margin:0;font:13px/1.5 var(--f);user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{color:var(--muted);padding:8px 0}
.install{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--mustard);border-radius:var(--r);padding:10px 14px;font-size:14px}
@media (max-width:600px){h1{font-size:22px}.date{min-width:0}.score{font-size:34px}}

/* kalendarz i korepetycje */
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{font:inherit;font-weight:600;border:0;background:none;padding:0;color:var(--fg);cursor:pointer;text-align:left}
.link:hover{color:var(--accent);text-decoration:underline}
.time{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px}
.row.struck .time,.row.struck .link{text-decoration:line-through;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.modal.wide{max-width:760px}
.btn.danger{color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0 4px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;font-size:15px;cursor:pointer}
.check input{width:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--mustard-soft);border-color:var(--mustard);color:var(--fg);font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .lbl{font-weight:700;font-size:17px;margin-inline:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:600;font-size:13px;border:0;background:var(--bg);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:140px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--mustard);background:var(--mustard-soft)}
.day h3{font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:0}
.day.today h3{color:var(--mustard-ink)}
.add{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px;border-radius:4px}
.add:hover{color:var(--accent);background:var(--accent-soft)}
.lz{font:inherit;border:0;text-align:left;cursor:pointer;display:block;width:100%;padding:6px 8px;border-radius:6px;background:var(--accent-soft);color:var(--fg);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.lz.done{background:var(--ok-soft)}
.lz.cancelled,.lz.moved{background:var(--surface);text-decoration:line-through;color:var(--muted)}
.day.today .lz{background:var(--bg)}
@media (max-width:780px){.week{grid-template-columns:1fr}.day{min-height:0}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.mday{font:inherit;color:inherit;text-align:left;border:1px solid var(--line);border-radius:6px;min-height:84px;padding:4px 6px;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.mday:hover{border-color:var(--accent)}
.mday.out{opacity:.45}
.mday.today{border-color:var(--mustard);background:var(--mustard-soft)}
.mday .d{font-size:12px;font-weight:700}
.mday .e{font-size:11px;line-height:1.25;border-radius:4px;padding:1px 4px;background:var(--accent-soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mday .e.done{background:var(--ok-soft)} .mday .e.cancelled,.mday .e.moved{text-decoration:line-through;background:var(--surface)}
.mday .cnt{display:none;font-size:11px;font-weight:700;color:var(--accent)}
@media (max-width:600px){.mday{min-height:52px}.mday .e{display:none}.mday .cnt{display:block}}
[hidden]{display:none!important}.ytbox{margin:12px 0 18px;display:grid;gap:8px}.ytframe{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}.ytframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
[data-due-set][aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.phs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ph{position:relative;display:inline-block}
.ph img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.phx{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.phadd{cursor:pointer}
.zoomov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.zoomov img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.tin{max-width:520px;font-size:16px}
.tans{padding:8px 12px;border-radius:8px;background:var(--surface);font-weight:600;max-width:520px}
.tans.ok{background:var(--ok-soft);color:var(--ok)} .tans.bad{background:var(--bad-soft);color:var(--bad)}
.essay{width:100%;font:inherit;font-size:16px;line-height:1.6}
.essayout{white-space:pre-wrap;background:var(--surface);border-radius:8px;padding:12px 14px;line-height:1.6}
.q.qgrp{border-bottom:0;padding-bottom:4px}
.q.qitem{padding:8px 0 12px;gap:6px}
.trbox{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:grid;gap:8px;margin:12px 0}
.trbox summary{cursor:pointer;font-weight:600;color:var(--accent)}
.pvbar{position:sticky;top:0;z-index:30;background:var(--mustard);color:var(--fg);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));font-size:14px}
.dayx{font:inherit;font-size:11px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;padding:2px 4px;margin-top:auto;text-decoration:underline}
.dayx:hover{color:var(--bad)}
</style>
</head>
